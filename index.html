<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ハートフルセンター 会員証</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background: linear-gradient(135deg, #e8f5e9 0%, #fff8e1 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .logo {
      margin-bottom: 12px;
    }

    .logo img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      color: #2e7d32;
      margin-bottom: 8px;
    }

    .greeting {
      font-size: 28px;
      font-weight: 700;
      color: #333;
      margin: 24px 0;
    }

    .profile {
      margin-top: 16px;
      padding: 16px;
      background: #f5f5f5;
      border-radius: 12px;
      font-size: 14px;
      color: #666;
    }

    .profile img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin-bottom: 8px;
    }

    .profile .name {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    .status {
      margin-top: 16px;
      font-size: 12px;
      color: #999;
    }

    .error {
      color: #d32f2f;
      margin-top: 16px;
      font-size: 14px;
    }

    .loading {
      color: #999;
      font-size: 16px;
      margin: 24px 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo"><img src="heartfull.png" alt="ハートフルセンター"></div>
    <div class="title">ハートフルセンター</div>

    <div id="loading" class="loading">読み込み中...</div>
    <div id="greeting" class="greeting" style="display:none;"></div>
    <div id="profile" class="profile" style="display:none;"></div>
    <div id="error" class="error" style="display:none;"></div>
    <div id="status" class="status"></div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/versions/2.24.0/sdk.js"></script>
  <script>
    // ★★★ ここにLIFF IDを設定 ★★★
    const LIFF_ID = "2010212153-DZcEHyHl";

    const $loading = document.getElementById("loading");
    const $greeting = document.getElementById("greeting");
    const $profile = document.getElementById("profile");
    const $error = document.getElementById("error");
    const $status = document.getElementById("status");

    async function main() {
      // LIFF ID未設定の場合はデモモードで動作
      if (LIFF_ID === "YOUR_LIFF_ID_HERE") {
        $loading.style.display = "none";
        $greeting.style.display = "block";
        $greeting.textContent = "こんにちは！";
        $status.textContent = "デモモード（LIFF ID未設定）";
        return;
      }

      try {
        await liff.init({ liffId: LIFF_ID });
        $status.textContent = "LIFF初期化完了";

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        $loading.style.display = "none";
        $greeting.style.display = "block";
        $greeting.textContent = "こんにちは！";

        $profile.style.display = "block";
        var avatarHtml = profile.pictureUrl
          ? '<img src="' + profile.pictureUrl + '" alt="" onerror="this.style.display=\'none\'">'
          : '';
        $profile.innerHTML = avatarHtml +
          '<div class="name">' + profile.displayName + ' さん</div>';

        $status.textContent = "LINE ログイン済み";

      } catch (err) {
        $loading.style.display = "none";
        $error.style.display = "block";
        $error.textContent = "エラー: " + err.message;
      }
    }

    main();
  </script>

</body>
</html>
